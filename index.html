<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#031936">
  <meta name="description" content="Itinerario Thailandia 2026">
  <title>Thailandia 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <button class="menu-button" type="button" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="hero__content">
      <h1>Thailandia 2026</h1>
      <p id="tripDates" class="trip-dates">22 novembre - 4 dicembre 2026</p>

      <div class="hero__buttons">
        <button id="todayButton" class="button" type="button">
          <span aria-hidden="true">▣</span>
          Vai a oggi
        </button>
        <button id="refreshButton" class="button" type="button">
          <span aria-hidden="true">↻</span>
          Aggiorna
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <nav class="app-tabs" aria-label="Sezioni">
      <button class="app-tabs__button is-active" type="button" data-action="itinerary">
        <span class="app-tabs__icon" aria-hidden="true">☷</span>
        <span>Itinerario</span>
      </button>
      <button class="app-tabs__button" type="button" data-action="weather">
        <span class="app-tabs__icon" aria-hidden="true">☀</span>
        <span>Meteo</span>
      </button>
      <button class="app-tabs__button" type="button" data-action="drive">
        <span class="app-tabs__icon" aria-hidden="true">▱</span>
        <span>Drive</span>
      </button>
      <button class="app-tabs__button" type="button">
        <span class="app-tabs__icon" aria-hidden="true">ⓘ</span>
        <span>Info utili</span>
      </button>
    </nav>
    <div id="status" class="status">Caricamento itinerario…</div>
    <nav id="dayNav" class="day-nav" aria-label="Giorni del viaggio"></nav>
    <section id="itinerary" class="itinerary"></section>
    <section id="weather" class="weather" aria-label="Meteo" hidden>
      <article class="weather__forecast">
        <h2 class="weather__title">Bangkok</h2>
        <iframe width="650" height="187" src="https://embed.windy.com/embed.html?type=forecast&amp;location=coordinates&amp;detail=true&amp;detailLat=13.752493799999998&amp;detailLon=100.49350889999998&amp;metricTemp=default&amp;metricRain=default&amp;metricWind=default" title="Previsioni meteo per Bangkok" frameborder="0" loading="lazy"></iframe>
      </article>
      <article class="weather__forecast">
        <h2 class="weather__title">Phuket</h2>
        <iframe width="650" height="187" src="https://embed.windy.com/embed.html?type=forecast&amp;location=coordinates&amp;detail=true&amp;detailLat=7.884790099999998&amp;detailLon=98.3891503&amp;metricTemp=default&amp;metricRain=default&amp;metricWind=default" title="Previsioni meteo per Phuket" frameborder="0" loading="lazy"></iframe>
      </article>
    </section>
    <section id="drive" class="drive" aria-label="Google Drive" hidden>
      <div class="drive__panel">
        <div class="drive__header">
          <h2 class="drive__title">Google Drive</h2>
          <a class="drive__external-link" href="https://drive.google.com/drive/folders/1AfGdsVZBeANQKay2WqrMhaTQGjzH6RqO?lfhs=2" target="_blank" rel="noopener noreferrer">
            Apri in Google Drive
          </a>
        </div>
        <div class="drive__frame-shell">
          <iframe
            class="drive__frame"
            data-src="https://drive.google.com/embeddedfolderview?id=1AfGdsVZBeANQKay2WqrMhaTQGjzH6RqO#grid"
            title="Cartella Google Drive del viaggio"
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    Dati dell'itinerario caricati da SheetDB
  </footer>

  <script src="app.js"></script>
</body>
</html>
