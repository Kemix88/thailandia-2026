<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#031936">
  <meta name="description" content="Itinerario Thailandia 2026">
  <title>Thailandia 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <button class="menu-button" type="button" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="hero__content">
      <h1>Thailandia 2026</h1>
      <p id="tripDates" class="trip-dates">22 novembre - 4 dicembre 2026</p>

      <div class="hero__buttons">
        <button id="todayButton" class="button" type="button">
          <span aria-hidden="true">▣</span>
          Vai a oggi
        </button>
        <button id="refreshButton" class="button" type="button">
          <span aria-hidden="true">↻</span>
          Aggiorna
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <nav class="app-tabs" aria-label="Sezioni">
      <button class="app-tabs__button is-active" type="button" data-action="itinerary">
        <span class="app-tabs__icon" aria-hidden="true">☷</span>
        <span>Itinerario</span>
      </button>
      <button class="app-tabs__button" type="button" data-action="weather">
        <span class="app-tabs__icon" aria-hidden="true">☀</span>
        <span>Meteo</span>
      </button>
      <button class="app-tabs__button" type="button">
        <span class="app-tabs__icon" aria-hidden="true">▱</span>
        <span>Prenotazioni</span>
      </button>
      <button class="app-tabs__button" type="button">
        <span class="app-tabs__icon" aria-hidden="true">ⓘ</span>
        <span>Info utili</span>
      </button>
    </nav>
    <div id="status" class="status">Caricamento itinerario…</div>
    <nav id="dayNav" class="day-nav" aria-label="Giorni del viaggio"></nav>
    <section id="itinerary" class="itinerary"></section>
    <section id="weather" class="weather" aria-label="Meteo" hidden>
      <iframe src="https://www.meteoblue.com/it/tempo/widget/three/lausanne_svizzera_6299715?geoloc=fixed&amp;nocurrent=0&amp;noforecast=0&amp;tempunit=CELSIUS&amp;windunit=KILOMETER_PER_HOUR&amp;days=4&amp;layout=dark&amp;user_key=307ff177bedc44a9&amp;embed_key=415331773b39e225&amp;sig=fac54efc72ebe15dacbd34550fc02e0dc612b3ab70e833a9402e0a3da7ce2d78" frameborder="0" scrolling="NO" allowtransparency="true" sandbox="allow-same-origin allow-scripts allow-popups allow-popups-to-escape-sandbox" style="width: 460px;height: 571px;border: 0;overflow: hidden;"></iframe>
      <div class="weather__credit">
        <!-- DO NOT REMOVE THIS LINK -->
        <a href="https://www.meteoblue.com/it/tempo/settimana/index" target="_blank" rel="noopener">meteoblue</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    Dati dell'itinerario caricati da SheetDB
  </footer>

  <script src="app.js"></script>
</body>
</html>
